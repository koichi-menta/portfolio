name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js 24 checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Enable Yarn from packageManager
        run: corepack enable

      - name: Set up Takumi Guard
        uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1

      - name: Verify Takumi Guard blocking
        shell: bash
        run: |
          test "$(npm config get registry)" = "https://npm.flatt.tech/"
          # Reject lockfile changes that would download packages outside the proxy.
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const urls = [...fs.readFileSync('yarn.lock', 'utf8').matchAll(/^  resolved "([^"]+)"/gm)];
          assert.ok(urls.length > 0, 'Expected locked package URLs');
          for (const [, url] of urls) {
            assert.equal(new URL(url).origin, 'https://npm.flatt.tech', `Package bypasses Takumi Guard: ${url}`);
          }
          NODE
          probe_dir=$(mktemp -d)
          trap 'rm -rf "$probe_dir"' EXIT
          cp .npmrc "$probe_dir/.npmrc"
          node -e 'const fs = require("node:fs"); const { packageManager } = require("./package.json"); fs.writeFileSync(process.argv[1], JSON.stringify({ name: "takumi-guard-probe", private: true, packageManager }));' "$probe_dir/package.json"
          # The official harmless test package must be rejected, even with an empty cache.
          if yarn --cwd "$probe_dir" add @panda-guard/test-malicious \
            --ignore-scripts --non-interactive --no-progress \
            --cache-folder "$probe_dir/cache" > "$probe_dir/install.log" 2>&1; then
            cat "$probe_dir/install.log"
            echo "::error::Takumi Guard did not block the test package"
            exit 1
          fi
          cat "$probe_dir/install.log"
          grep -F 'https://npm.flatt.tech/' "$probe_dir/install.log"
          grep -E '403|Forbidden' "$probe_dir/install.log"

      - name: Install dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check types
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Run regression tests
        run: yarn test:review

      - name: Build production site
        run: yarn build
